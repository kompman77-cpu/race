<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Статистика игр</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1428;color:#fff;max-width:520px;margin:40px auto;padding:0 20px;text-align:center}
h1{color:#a5f3fc}.big{font-size:52px;font-weight:800;color:#fde047;margin:10px 0}
.game{background:#142244;border:1px solid #243657;border-radius:14px;padding:20px;margin:16px 0}
small{color:#a5b4fc}
</style></head><body>
<h1>📊 Мои игры</h1>
<div id="box">Загружаю…</div>
<script>
const games=[['race','🏎️ Ночные гонки'],['puzzle','🧩 Вторая игра']];
const API='https://abacus.jasoncameron.dev/get/neon-games/';
let h='';
for(const [key,title] of games){
  h+='<div class="game" id="'+key+'">'+title+'<br><small>считаю…</small></div>';
  ask(key,title,1);
}
document.getElementById('box').innerHTML=h;
function show(key,title,val,note){
  document.getElementById(key).innerHTML=title+
    '<div class="big">'+(val??'—')+'</div><small>'+note+'</small>';
}
function ask(key,title,tryN){
  fetch(API+key).then(r=>r.json()).then(d=>{
    const v=d.value??0;
    try{localStorage.setItem('cnt_'+key,v)}catch(e){}
    show(key,title,v,'запусков игры');
  }).catch(()=>{
    let saved=null;
    try{saved=localStorage.getItem('cnt_'+key)}catch(e){}
    if(tryN<4){
      show(key,title,saved,'сервис просыпается, ждём…');
      setTimeout(()=>ask(key,title,tryN+1),15000); // ещё попытка через 15 сек
    }else{
      show(key,title,saved,'сервис спит. Обнови страницу через минуту');
    }
  });
}
</script></body></html>
